[package]
name = "cachesim"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bzip2 = "0.6"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
object = "0.39"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2.0"
bzip2 = "0.6"
predicates = "3.1"
proptest = "1.6"
tempfile = "3.12"
